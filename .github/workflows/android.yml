name: Android CI and experimental alpha release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform 35 (preinstalled SDK)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and APK build
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Package and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HyperBudsUnlock-v0.1.1-alpha.2-debug.apk
          (cd dist && sha256sum HyperBudsUnlock-v0.1.1-alpha.2-debug.apk > HyperBudsUnlock-v0.1.1-alpha.2-debug.apk.sha256)
          test -s dist/HyperBudsUnlock-v0.1.1-alpha.2-debug.apk

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperBudsUnlock-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Publish one-time alpha pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=v0.1.1-alpha.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Alpha tag already released; skipping"
            exit 0
          fi
          gh release create "$TAG" \
            dist/HyperBudsUnlock-v0.1.1-alpha.2-debug.apk \
            dist/HyperBudsUnlock-v0.1.1-alpha.2-debug.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TAG (experimental debug-signed)" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease
